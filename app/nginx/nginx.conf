# Path-based routing: /api/catalog/* -> catalog service, /api/orders/* -> orders service,
# everything else is the static front end.

upstream catalog { server catalog:8000; }
upstream orders  { server orders:8000; }

server {
    listen 80 default_server;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    # Load balancer health check: this node is healthy if nginx and the app processes answer.
    location = /healthz {
        access_log off;
        proxy_pass http://catalog/live;
    }

    location /api/catalog/ {
        proxy_pass http://catalog;
    }

    location /api/orders/ {
        proxy_pass http://orders;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
